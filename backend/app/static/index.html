<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Software Engineering Agent</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #000000;
        line-height: 1.5;
      }

      code, pre {
        font-family: Consolas, "Courier New", monospace;
      }

      .header {
        border-bottom: 2px solid #000000;
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
      }

      .header-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .header-sub {
        font-size: 0.8rem;
        color: #444444;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.55rem;
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
      }

      .badge.inverted {
        background: #000000;
        color: #ffffff;
      }

      .container {
        max-width: 1320px;
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 1.5rem;
      }

      @media (max-width: 960px) {
        .container {
          grid-template-columns: 1fr;
        }
      }

      .box {
        border: 1px solid #000000;
        background: #ffffff;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .box-title {
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-bottom: 1px solid #000000;
        padding-bottom: 0.5rem;
        margin-bottom: 0.85rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .field {
        margin-bottom: 0.8rem;
      }

      .label {
        display: block;
        font-size: 0.78rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
        color: #000000;
      }

      .input, .select, .textarea {
        width: 100%;
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 0.5rem;
        font-size: 0.84rem;
      }

      .textarea {
        min-height: 75px;
        resize: vertical;
        font-family: Consolas, monospace;
        font-size: 0.78rem;
      }

      .btn {
        border: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }

      .btn:hover, .btn.active {
        background: #000000;
        color: #ffffff;
      }

      .btn-run {
        width: 100%;
        border: 2px solid #000000;
        background: #000000;
        color: #ffffff;
        padding: 0.65rem 1rem;
        font-size: 0.88rem;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
      }

      .btn-run:hover:not(:disabled) {
        background: #ffffff;
        color: #000000;
      }

      .btn-run:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .pipeline-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      @media (max-width: 800px) {
        .pipeline-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .agent-step {
        border: 1px solid #000000;
        padding: 0.65rem;
        background: #ffffff;
      }

      .agent-step.active-step {
        background: #000000;
        color: #ffffff;
      }

      .tabs {
        display: flex;
        border-bottom: 1px solid #000000;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .tab {
        border: none;
        border-right: 1px solid #000000;
        background: #ffffff;
        color: #000000;
        padding: 0.55rem 0.9rem;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }

      .tab.active {
        background: #000000;
        color: #ffffff;
      }

      .code-block {
        border: 1px solid #000000;
        background: #f7f7f7;
        color: #000000;
        padding: 0.75rem;
        font-size: 0.78rem;
        overflow-x: auto;
        max-height: 420px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      .item-row {
        border: 1px solid #000000;
        padding: 0.75rem;
        margin-bottom: 0.6rem;
        background: #ffffff;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      @media (max-width: 800px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const AGENTS = [
        { num: "01", name: "Code Understanding", desc: "AST & Vector Index" },
        { num: "02", name: "Debugging Agent", desc: "Root Cause Analysis" },
        { num: "03", name: "Code Generation", desc: "Proposes Patch" },
        { num: "04", name: "Testing Agent", desc: "Pytest Self-Heal Loop" },
        { num: "05", name: "Code Review", desc: "Audit & Pull Request" },
      ];

      const state = {
        health: null,
        samples: [],
        runs: [],
        currentRun: null,
        activeTab: "timeline",
        loading: false,
        error: "",
        repoSource: "sample:ecommerce_checkout_bug",
        issueDescription: "",
        errorLogs: "",
        maxIterations: 3,
        demonstrateSelfHealing: true,
      };

      function esc(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function init() {
        try {
          const [h, s, r] = await Promise.all([
            fetch("/api/health").then((x) => x.json()),
            fetch("/api/samples").then((x) => x.json()),
            fetch("/api/runs").then((x) => x.json()),
          ]);
          state.health = h;
          state.samples = s.samples || [];
          state.runs = r || [];
          if (state.samples.length > 0) {
            state.repoSource = state.samples[0].repo_source;
            state.issueDescription = state.samples[0].issue_description;
            state.errorLogs = state.samples[0].error_logs;
          }
          if (state.runs.length > 0) {
            state.currentRun = state.runs[0];
          }
        } catch (e) {
          state.error = e.message;
        }
        render();
      }

      window.pickSample = function(i) {
        const s = state.samples[i];
        if (!s) return;
        state.repoSource = s.repo_source;
        state.issueDescription = s.issue_description;
        state.errorLogs = s.error_logs;
        render();
      };

      window.pickRun = function(i) {
        state.currentRun = state.runs[i];
        render();
      };

      window.switchTab = function(t) {
        state.activeTab = t;
        render();
      };

      window.runAgent = async function(e) {
        e.preventDefault();
        state.repoSource = document.getElementById("repoSource").value;
        state.issueDescription = document.getElementById("issueDescription").value;
        state.errorLogs = document.getElementById("errorLogs").value;
        state.demonstrateSelfHealing = document.getElementById("selfHeal").checked;
        state.loading = true;
        state.error = "";
        render();

        try {
          const resp = await fetch("/api/runs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              repo_source: state.repoSource,
              issue_description: state.issueDescription,
              error_logs: state.errorLogs,
              llm_provider: "auto",
              max_iterations: state.maxIterations,
              demonstrate_self_healing: state.demonstrateSelfHealing,
            }),
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || "Run failed");
          }
          state.currentRun = await resp.json();
          state.runs = await fetch("/api/runs").then((x) => x.json());
        } catch (err) {
          state.error = err.message;
        } finally {
          state.loading = false;
          render();
        }
      };

      function renderTab(run) {
        if (!run) {
          return '<div style="padding:2rem;text-align:center">Select a sample repository on the left and click <strong>RUN AGENT PIPELINE</strong>.</div>';
        }

        if (state.activeTab === "timeline") {
          const iters = (run.test_history || []).map((it) => `
            <div class="item-row">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                <strong>Iteration #${it.iteration}</strong>
                <span class="badge ${it.passed ? "inverted" : ""}">
                  ${it.passed ? `PASSED (${it.passed_count})` : `FAILED (${it.failed_count}) -> RETRY`}
                </span>
              </div>
              <div style="font-size:0.8rem;margin-bottom:0.5rem">${esc(it.note)}</div>
              <pre class="code-block">${esc(it.output)}</pre>
            </div>
          `).join("");

          const steps = (run.agent_timeline || []).map((st) => `
            <div class="item-row">
              <div style="display:flex;justify-content:space-between">
                <strong>${st.step}. ${esc(st.agent)}</strong>
                <span class="badge">${esc(st.status)} (${st.duration_ms} ms)</span>
              </div>
              <div style="font-size:0.82rem;margin-top:0.25rem">${esc(st.summary)}</div>
            </div>
          `).join("");

          return `
            <div class="grid-2">${iters}</div>
            <div style="margin-top:1rem">
              <div class="label" style="margin-bottom:0.5rem">AGENT EXECUTION STEPS</div>
              ${steps}
            </div>
          `;
        }

        if (state.activeTab === "bugs") {
          const rc = run.root_cause_analysis || {};
          const bugs = (rc.identified_bugs || []).map((b) => `
            <div class="item-row">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.25rem">
                <strong><code>${esc(b.file)}:${b.line}</code> (${esc(b.symbol)})</strong>
                <span class="badge inverted">${esc(b.category)}</span>
              </div>
              <div style="font-size:0.82rem">${esc(b.explanation)}</div>
            </div>
          `).join("");

          return `
            <div class="item-row">
              <strong>Summary:</strong> ${esc(rc.summary)}
              <pre style="margin-top:0.5rem;white-space:pre-wrap;font-size:0.8rem">${esc(rc.detailed_explanation)}</pre>
            </div>
            ${bugs}
          `;
        }

        if (state.activeTab === "diff") {
          return `
            <div class="grid-2">
              <div>
                <div class="label">PROPOSED CODE DIFF</div>
                <pre class="code-block">${esc(run.proposed_changes?.unified_diff)}</pre>
              </div>
              <div>
                <div class="label">GENERATED UNIT TESTS (${esc(run.generated_tests?.test_file_path)})</div>
                <pre class="code-block">${esc(run.generated_tests?.test_code)}</pre>
              </div>
            </div>
          `;
        }

        if (state.activeTab === "pr") {
          const pr = run.pull_request || {};
          const rev = run.code_review || {};
          return `
            <div class="item-row">
              <div style="display:flex;justify-content:space-between">
                <strong>Code Review Verdict: ${esc(rev.verdict)} (Score: ${rev.score}/100)</strong>
                <span class="badge inverted">${esc(pr.branch)} -> ${esc(pr.base_branch)}</span>
              </div>
              <div style="font-size:0.82rem;margin-top:0.35rem">${esc(rev.summary)}</div>
            </div>
            <div class="label">${esc(pr.title)}</div>
            <pre class="code-block">${esc(pr.body_markdown)}</pre>
          `;
        }

        return "";
      }

      function render() {
        const sampleBtns = state.samples.map((s, i) => `
          <button type="button" class="btn ${state.repoSource === s.repo_source ? "active" : ""}" onclick="pickSample(${i})">
            ${esc(s.repo_source.replace("sample:", ""))}
          </button>
        `).join("");

        const historyBtns = state.runs.slice(0, 5).map((r, i) => `
          <button type="button" class="btn ${state.currentRun?.id === r.id ? "active" : ""}" onclick="pickRun(${i})" style="display:flex;justify-content:space-between;width:100%;margin-bottom:0.35rem">
            <span>${esc(r.repo_name)} (${r.iterations_used} iter)</span>
            <span>${r.tests_passed ? "PASS" : r.status}</span>
          </button>
        `).join("");

        const agentsBar = AGENTS.map((a) => `
          <div class="agent-step ${state.currentRun ? "active-step" : ""}">
            <div style="font-size:0.7rem;font-weight:700">AGENT ${a.num}</div>
            <div style="font-size:0.82rem;font-weight:700">${a.name}</div>
            <div style="font-size:0.72rem;opacity:0.8">${a.desc}</div>
          </div>
        `).join("");

        document.getElementById("root").innerHTML = `
          <header class="header">
            <div>
              <div class="header-title">AI SOFTWARE ENGINEERING AGENT</div>
              <div class="header-sub">5-Agent LangGraph Pipeline • Self-Healing Test Loop</div>
            </div>
            <div>
              <span class="badge inverted">${state.health ? "ONLINE" : "CONNECTING"}</span>
              <span class="badge">${esc(state.health?.database_backend || "local")}</span>
            </div>
          </header>

          <main class="container">
            <aside>
              <div class="box">
                <div class="box-title">
                  <span>Input Repository</span>
                </div>

                <div class="field">
                  <span class="label">Sample Buggy Repos:</span>
                  <div style="display:flex;flex-direction:column;gap:0.35rem">${sampleBtns}</div>
                </div>

                <form onsubmit="runAgent(event)">
                  <div class="field">
                    <label class="label">Repo URL / Path / Sample ID</label>
                    <input id="repoSource" class="input" value="${esc(state.repoSource)}" required />
                  </div>
                  <div class="field">
                    <label class="label">Issue Description</label>
                    <textarea id="issueDescription" class="textarea">${esc(state.issueDescription)}</textarea>
                  </div>
                  <div class="field">
                    <label class="label">Error Logs</label>
                    <textarea id="errorLogs" class="textarea">${esc(state.errorLogs)}</textarea>
                  </div>
                  <div class="field">
                    <label style="font-size:0.78rem;display:flex;gap:0.4rem;align-items:center;cursor:pointer">
                      <input id="selfHeal" type="checkbox" ${state.demonstrateSelfHealing ? "checked" : ""} />
                      <span>Demonstrate Self-Healing Retry Loop</span>
                    </label>
                  </div>
                  <button type="submit" class="btn-run" ${state.loading ? "disabled" : ""}>
                    ${state.loading ? "RUNNING AGENTS..." : "RUN AGENT PIPELINE"}
                  </button>
                </form>

                ${state.error ? `<div style="border:1px solid #000;padding:0.5rem;margin-top:0.75rem;font-size:0.78rem">ERROR: ${esc(state.error)}</div>` : ""}
              </div>

              <div class="box">
                <div class="box-title"><span>Recent Runs</span></div>
                ${historyBtns || '<div style="font-size:0.78rem">No runs yet.</div>'}
              </div>
            </aside>

            <section>
              <div class="box">
                <div class="box-title">
                  <span>5-Agent Pipeline</span>
                  ${state.currentRun ? `<span class="badge inverted">Iterations: ${state.currentRun.iterations_used} | Tests Passed: ${state.currentRun.tests_passed ? "YES" : "NO"}</span>` : ""}
                </div>

                <div class="pipeline-grid">${agentsBar}</div>

                <div class="tabs">
                  <button class="tab ${state.activeTab === "timeline" ? "active" : ""}" onclick="switchTab('timeline')">
                    1. Self-Healing Test Loop
                  </button>
                  <button class="tab ${state.activeTab === "bugs" ? "active" : ""}" onclick="switchTab('bugs')">
                    2. Root Cause Analysis
                  </button>
                  <button class="tab ${state.activeTab === "diff" ? "active" : ""}" onclick="switchTab('diff')">
                    3. Code Fix & Unit Tests
                  </button>
                  <button class="tab ${state.activeTab === "pr" ? "active" : ""}" onclick="switchTab('pr')">
                    4. Code Review & PR
                  </button>
                </div>

                ${renderTab(state.currentRun)}
              </div>
            </section>
          </main>
        `;
      }

      init();
    </script>
  </body>
</html>
